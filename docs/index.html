<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机票追踪</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2330;--mut:#6b7686;--line:#e3e7ee;--acc:#2f6fed;--est:#c9d3e6}
@media(prefers-color-scheme:dark){:root{--bg:#12161d;--card:#1b212b;--fg:#e6eaf0;--mut:#97a1b0;--line:#2b3340;--acc:#6c9bff;--est:#3a4558}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:16px}h1{font-size:20px;margin:8px 0 12px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
input,select{font:inherit;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
button{font:inherit;padding:8px 14px;border:0;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer;align-self:end}
.note{color:var(--mut);font-size:13px}.warn{color:#b45309}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mut);font-weight:500;font-size:12px}.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:0 6px;border-radius:9px;background:var(--bg);border:1px solid var(--line);font-size:12px}
canvas{max-height:300px}
</style></head><body><main>
<h1>✈ 机票追踪</h1>
<div class="card"><form id="f">
<label>出发地<input id="o" value="YUL" maxlength="3"></label>
<label>目的地<input id="d" value="PEK" maxlength="3"></label>
<label>出发日期<input id="dep" type="date"></label>
<label>返程日期<input id="ret" type="date"></label>
<label>停靠次数<select id="st"><option value="0">仅直飞</option><option value="1" selected>≤1 次</option><option value="2">≤2 次</option></select></label>
<label>舱位<select id="cab"><option value="economy" selected>经济舱</option><option value="premium-economy">超级经济舱</option><option value="business">商务舱</option><option value="first">头等舱</option></select></label>
<label>成人<input id="ad" type="number" min="1" max="9" value="1"></label>
<label>儿童<input id="ch" type="number" min="0" max="8" value="0"></label>
<button>查看</button></form>
<div id="chips" style="margin-top:8px"></div><p class="note" id="status"></p></div>
<div class="card" id="mxCard" style="display:none"><h2>价格矩阵（出发日 × 返程日）</h2>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px">
<label>查看日期<select id="mxSnap"></select></label><label>对比<select id="mxCmp"></select></label></div>
<div style="overflow-x:auto"><table id="mx"></table></div><p class="note" id="mxNote"></p></div>
<div class="card"><h2>淡旺季（每月参考价）</h2><canvas id="sea"></canvas><p class="note" id="seaNote"></p></div>
<div class="card"><h2>价格走势（各出发日的最低价）</h2><canvas id="trend"></canvas><p class="note" id="trNote"></p></div>
<div class="card"><h2>哪天买票更划算（按星期几）</h2><canvas id="wk"></canvas><p class="note" id="wkNote"></p></div>
<div class="card"><h2>提前多久买（距出发天数）</h2><canvas id="dtd"></canvas><p class="note" id="dtdNote"></p></div>
<div class="card"><h2>推荐航班（转机少 → 用时短 → 价格低）</h2><div id="res"></div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const MONTHS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
let charts={};
const fmtMin=m=>Math.floor(m/60)+'小时'+String(m%60).padStart(2,'0')+'分';
async function j(u){const r=await fetch(u,{cache:'no-cache'});if(!r.ok)throw 0;return r.json()}
const addDays=(d,n)=>new Date(new Date(d+'T00:00:00Z').getTime()+n*864e5).toISOString().slice(0,10);
const WD=['周日','周一','周二','周三','周四','周五','周六'];
function analyze(doc){
  // weekday: price on a day vs. the mean of the surrounding 7 days (removes the overall trend)
  const g=Array.from({length:7},()=>[]),dt=new Map();let n=0;
  for(const[dep,h]of Object.entries(doc.history)){
    const ds=Object.keys(h).sort(),m=ds.reduce((a,d)=>a+h[d],0)/(ds.length||1);
    for(const d of ds){
      const win=[-3,-2,-1,0,1,2,3].map(i=>h[addDays(d,i)]);
      if(win.every(x=>x!=null)){g[new Date(d+'T00:00:00Z').getUTCDay()].push(h[d]/(win.reduce((a,b)=>a+b)/7));n++}
      const k=Math.floor((new Date(dep)-new Date(d))/864e5/14)*14;
      if(k>=0)(dt.get(k)||dt.set(k,[]).get(k)).push(h[d]/m)}}
  const pct=a=>a.length?+((a.reduce((x,y)=>x+y)/a.length-1)*100).toFixed(2):null;
  const order=[1,2,3,4,5,6,0];
  draw('wk',{type:'bar',data:{labels:order.map(i=>WD[i]),datasets:[{label:'相对前后一周均价 (%)',data:order.map(i=>pct(g[i])),backgroundColor:'#2f6fed'}]},options:{plugins:{legend:{display:false}},scales:{y:{title:{display:true,text:'% 相对均价（越低越划算）'}}}}});
  $('wkNote').textContent=n<28?'样本 '+n+' 条，不足约 4 周数据，结论暂不可靠；每天自动积累。':'基于 '+n+' 条记录（查询日按 UTC 计）。差异通常只有几个百分点，样本越多越可信。';
  const ks=[...dt.keys()].sort((a,b)=>b-a);
  draw('dtd',{type:'line',data:{labels:ks.map(k=>k+'–'+(k+13)+' 天前'),datasets:[{label:'相对均价 (%)',data:ks.map(k=>pct(dt.get(k))),borderColor:'#e0662b',tension:.2}]},options:{plugins:{legend:{display:false}}}});
  $('dtdNote').textContent=ks.length<3?'数据还不够，需要几周后才能看出价格随临近出发的变化。':'从左（离出发远）到右（临近出发）；上升段就是开始涨价的时期。';
}
async function loadMatrix(id){
  const card=$('mxCard');let idx;
  try{idx=await j('data/matrix/'+id+'/index.json')}catch{card.style.display='none';return}
  card.style.display='';
  const snaps=[...idx.snapshots].sort().reverse();
  const fill=(sel,opts)=>{sel.textContent='';opts.forEach(([v,t])=>{const o=mk('option',t);o.value=v;sel.appendChild(o)})};
  fill($('mxSnap'),snaps.map(x=>[x,x]));
  fill($('mxCmp'),[['','不对比'],...snaps.map(x=>[x,x])]);
  const draw_=async()=>{
    const cur=await j('data/matrix/'+id+'/'+$('mxSnap').value+'.json');
    let cmp=null;if($('mxCmp').value&&$('mxCmp').value!==$('mxSnap').value)try{cmp=await j('data/matrix/'+id+'/'+$('mxCmp').value+'.json')}catch{}
    const all=Object.values(cur.p).flat().filter(x=>x!=null),lo=Math.min(...all),hi=Math.max(...all);
    const t=$('mx');t.textContent='';
    const h=mk('tr');h.appendChild(mk('th','出发 \\ 停留天数'));
        cur.offsets.forEach(o=>h.appendChild(mk('th',o+' 天','num')));
    t.appendChild(h);
    for(const[dep,row]of Object.entries(cur.p)){
      const tr=mk('tr');tr.appendChild(mk('td',dep.slice(5)+' '+WD[new Date(dep+'T00:00:00Z').getUTCDay()]));
      row.forEach((v,i)=>{const td=mk('td',v==null?'–':v,'num');td.title='返程 '+addDays(dep,cur.offsets[i]);
        if(v!=null){const f=hi>lo?(v-lo)/(hi-lo):0;td.style.background='hsla(145,55%,45%,'+(0.42*(1-f)).toFixed(2)+')';if(v===lo)td.style.fontWeight='700';
          const pv=cmp&&cmp.p[dep]?cmp.p[dep][i]:null;
          if(pv!=null&&pv!==v){const d=v-pv,sp=mk('div',(d>0?'▲':'▼')+Math.abs(d),'note');sp.style.color=d>0?'#c0392b':'#1b9e77';sp.style.fontSize='11px';td.appendChild(sp)}}
        tr.appendChild(td)});t.appendChild(tr)}
    $('mxNote').textContent='单位 '+cur.currency+'，每格为该日期组合当天抓到的最低价（鼠标悬停可看返程日期）；绿色越深越便宜，最低价加粗。'+(cmp?'小三角为相对 '+$('mxCmp').value+' 的涨跌。':'');
  };
  $('mxSnap').onchange=$('mxCmp').onchange=draw_;
  if(snaps.length>1)$('mxCmp').value=snaps[Math.min(7,snaps.length-1)];
  draw_();
}
function draw(id,cfg){charts[id]&&charts[id].destroy();charts[id]=new Chart($(id),cfg)}
function mk(tag,txt,cls){const e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}

async function run(e){
  e&&e.preventDefault();
  const o=$('o').value.toUpperCase().trim(),d=$('d').value.toUpperCase().trim(),id=o+'-'+d;
  const stops=+$('st').value;
  let seas,doc=null;
  try{seas=await j('data/seasonality.json')}catch{seas=null}
  try{doc=await j('data/'+id+'.json')}catch{}
  // seasonality: estimate bars + measured overlay
  if(seas){
    const f=seas.dest_factor[d]||seas.dest_factor.default;
    const est=seas.month_index_roundtrip_economy_1stop.map(x=>Math.round(x*seas.base_price*f));
    const meas=Array(12).fill(null);
    if(doc){const by={};
      for(const[dep,h]of Object.entries(doc.history)){const days=Object.keys(h).sort();
        const m=+dep.slice(5,7)-1;(by[m]=by[m]||[]).push(h[days[days.length-1]])}
      for(const m in by)meas[m]=Math.round(by[m].reduce((a,b)=>a+b)/by[m].length)}
    draw('sea',{type:'bar',data:{labels:MONTHS,datasets:[
      {label:'估算',data:est,backgroundColor:getComputedStyle(document.body).getPropertyValue('--est')||'#c9d3e6'},
      {label:'实测',data:meas,backgroundColor:'#2f6fed'}]},
      options:{plugins:{legend:{position:'bottom'}},scales:{y:{title:{display:true,text:seas.currency}}}}});
    $('seaNote').textContent=seas.note+(['PEK','PVG','SHA','CGO','CAN'].includes(d)?'':'（该目的地使用通用系数）');
  }
  if(!doc){$('mxCard').style.display='none';charts.wk&&charts.wk.destroy();charts.dtd&&charts.dtd.destroy();
    $('status').innerHTML='';
    $('status').appendChild(mk('span','路线 '+id+' 还没有被追踪。请在 config.json 的 routes 中添加后，下次定时任务会开始记录。','warn'));
    $('trNote').textContent='';$('res').textContent='';charts.trend&&charts.trend.destroy();return}
  $('status').textContent='数据更新于 '+doc.updated.replace('T',' ').replace('Z',' UTC')+
    (doc.route.cabin!==$('cab').value||doc.route.adults!=$('ad').value||doc.route.children!=$('ch').value?
     ' ｜ 注意：该路线追踪的是 '+doc.route.cabin+'、成人'+doc.route.adults+'、儿童'+doc.route.children+'，与你选的不同，价格仅供参考':'');
  // trend
  const stay=doc.route.stay_days||42,W=doc.route.windows||[];
  if(!$('dep').dataset.touched&&W.length){$('dep').value=W[0].center;$('ret').value=addDays(W[0].center,stay)}
  const ch=$('chips');ch.textContent='';
  W.forEach(w=>{const b=mk('button',w.label);b.type='button';b.style.cssText='margin:0 6px 6px 0;padding:4px 10px;font-size:13px';
    b.onclick=()=>{$('dep').value=w.center;$('dep').dataset.touched=1;$('ret').value=addDays(w.center,stay);run()};ch.appendChild(b)});
  analyze(doc);loadMatrix(id);
  const dep=$('dep').value,flex=7;
  const near=Object.keys(doc.latest).sort().filter(k=>!dep||Math.abs((new Date(k)-new Date(dep))/864e5)<=flex);
  const days=[...new Set(near.flatMap(k=>Object.keys(doc.history[k]||{})))].sort();
  const pal=['#2f6fed','#e0662b','#1b9e77','#9b59b6','#d4a017','#c0392b','#16a085'];
  draw('trend',{type:'line',data:{labels:days,datasets:near.map((k,i)=>({label:'出发 '+k,
    data:days.map(x=>(doc.history[k]||{})[x]??null),borderColor:pal[i%7],spanGaps:true,tension:.2}))},
    options:{plugins:{legend:{position:'bottom'}}}});
  $('trNote').textContent=days.length<2?'目前只有 '+days.length+' 天的数据，走势会随每日记录逐步形成。':'';
  // offers
  const rows=[];
  for(const k of near){const L=doc.latest[k];for(const of of L.offers)if(of.stops<=stops)rows.push({k,ret:L.return,...of})}
  rows.sort((a,b)=>a.stops-b.stops||a.duration-b.duration||a.price-b.price);
  const box=$('res');box.textContent='';
  if(!rows.length){box.textContent='所选日期范围内没有符合条件的航班。';return}
  const t=mk('table'),h=mk('tr');
  ['出发','航司','停靠','用时','价格'].forEach((x,i)=>h.appendChild(mk('th',x,i==4?'num':'')));
  t.appendChild(h);
  for(const r of rows.slice(0,25)){const tr=mk('tr');
    tr.appendChild(mk('td',r.dep));
    tr.appendChild(mk('td',r.airlines.join(' / ')));
    tr.appendChild(mk('td',r.stops==0?'直飞':r.stops+' 次'+(r.via.length?'（'+r.via.join(',')+'）':'')));
    tr.appendChild(mk('td',fmtMin(r.duration)));
    tr.appendChild(mk('td',r.price+' '+doc.currency,'num'));t.appendChild(tr)}
  box.appendChild(t);
}
const t0=new Date(Date.now()+180*864e5);$('dep').value=t0.toISOString().slice(0,10);
$('ret').value=new Date(t0.getTime()+30*864e5).toISOString().slice(0,10);
$('dep').addEventListener('input',()=>{$('dep').dataset.touched=1});$('f').addEventListener('submit',run);run();
</script></body></html>
