<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机票追踪</title>
<style>
:root{
  --bg:#eef1f7;--card:#fff;--fg:#14213d;--mut:#5d6b82;--line:#e1e6f0;--soft:#f5f7fb;
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c7:#6250d6;--c8:#e34948;
  --good:#1a8f4c;--warn:#b87500;--bad:#d03b3a;--grid:#e6eaf2;
  --hero1:#2a78d6;--hero2:#6250d6;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131c;--card:#171e2b;--fg:#e8edf6;--mut:#9aa7bd;--line:#273146;--soft:#1d2636;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c7:#9085e9;--c8:#e66767;
  --good:#3fb97a;--warn:#e0a43a;--bad:#e66767;--grid:#273146;--hero1:#1f4f95;--hero2:#40358f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1480px;margin:0 auto;padding:0 20px}
h2{font-size:16px;margin:0 0 10px}
.top{background:linear-gradient(120deg,var(--hero1),var(--hero2));color:#fff;padding:16px 0 14px}
.brand{display:flex;align-items:baseline;gap:12px;font-size:21px;font-weight:700;margin-bottom:12px}
.brand small{font-size:12px;font-weight:400;opacity:.85}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;align-items:end}
form label{display:flex;flex-direction:column;font-size:12px;gap:3px;color:rgba(255,255,255,.85)}
form input,form select{font:inherit;padding:8px;border:0;border-radius:8px;background:rgba(255,255,255,.96);color:#14213d}
.go{font:inherit;font-weight:600;padding:9px 14px;border:0;border-radius:8px;background:#ffd166;color:#3a2a00;cursor:pointer}
#chips{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;padding:4px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
.chip.on{background:#fff;color:#2a4a9a;font-weight:600}
nav.tabs{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{font:inherit;font-weight:600;color:var(--mut);background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--c1);border-bottom-color:var(--c1)}
main{padding:16px 0 40px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,33,61,.04)}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.grid-eq{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px;align-items:start}
@media(max-width:980px){.grid2{grid-template-columns:1fr}.grid-eq{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-top:4px solid var(--k,var(--c1))}
.kpi .l{font-size:12px;color:var(--mut)}.kpi .v{font-size:26px;font-weight:700;line-height:1.2;margin:2px 0}.kpi .s{font-size:12px;color:var(--mut)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.head h2{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:4px 12px;border:0;background:var(--card);color:var(--mut);cursor:pointer}
.seg button.on{background:var(--c1);color:#fff}
.note{color:var(--mut);font-size:13px;margin:8px 0 0}.warn{color:var(--warn)}
.fl{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px 12px 0;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:var(--soft);overflow:hidden}
.fl .bar{align-self:stretch;background:var(--s)}
.fl .t{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.fl .m{font-size:13px;color:var(--mut);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;background:var(--s)}
.badge{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:600;margin-left:6px;background:color-mix(in srgb,var(--b) 18%,transparent);color:var(--b)}
.fl .p{text-align:right;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.fl .p small{display:block;font-size:12px;font-weight:400;color:var(--mut)}
#sumList{margin:0;padding:0;list-style:none}
#sumList li{padding:8px 10px 8px 12px;margin-bottom:8px;border-left:4px solid var(--c1);background:var(--soft);border-radius:0 8px 8px 0;font-size:14px}
#sumList li.good{border-left-color:var(--good)}#sumList li.wait{border-left-color:var(--warn)}#sumList li.info{border-left-color:var(--c7)}
table{width:100%;border-collapse:separate;border-spacing:2px}
th{color:var(--mut);font-weight:500;font-size:12px;padding:4px 6px;text-align:right;position:sticky;top:0;background:var(--card)}
th:first-child,td:first-child{text-align:left;white-space:nowrap}
td{padding:5px 6px;font-size:14px;border-radius:6px;text-align:right;font-variant-numeric:tabular-nums}
td:first-child{font-weight:600}
.ctrl{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;align-items:end}
.ctrl label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.ctrl select,.ctrl input{font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
canvas{max-height:340px}
</style></head><body>
<header class="top"><div class="wrap">
  <div class="brand">✈ 机票追踪 <small id="upd"></small></div>
  <form id="f">
    <label>出发地<input id="o" value="YUL" maxlength="3"></label>
    <label>目的地<input id="d" value="PEK" maxlength="3"></label>
    <label>出发日期<input id="dep" type="date"></label>
    <label>返程日期<input id="ret" type="date"></label>
    <label>停靠次数<select id="st"><option value="0">仅直飞</option><option value="1" selected>≤1 次</option><option value="2">≤2 次</option></select></label>
    <label>舱位<select id="cab"><option value="economy" selected>经济舱</option><option value="premium-economy">超级经济舱</option><option value="business">商务舱</option><option value="first">头等舱</option></select></label>
    <label>成人<input id="ad" type="number" min="1" max="9" value="1"></label>
    <label>儿童<input id="ch" type="number" min="0" max="8" value="0"></label>
    <button class="go">查看</button>
  </form>
  <div id="chips"></div>
</div></header>
<div class="wrap">
<nav class="tabs" id="tabs">
  <button data-tab="ov" class="on">总览</button><button data-tab="mx">价格矩阵</button>
  <button data-tab="se">走势与淡旺季</button><button data-tab="tm">买票时机</button>
</nav>
<main>
<p class="note" id="status"></p>
<section id="t-ov" class="tab on">
  <div class="kpis" id="kpis"></div>
  <div class="grid2">
    <div class="card"><div class="head"><h2>航班</h2>
      <div class="seg" id="sort"><button data-s="rec" class="on">推荐</button><button data-s="price">最便宜</button><button data-s="dur">最快</button></div></div>
      <div id="res"></div></div>
    <div>
      <div class="card" id="sumCard" style="display:none"><h2>智能总结</h2><ul id="sumList"></ul>
        <p class="note">基于已收集数据的统计规则生成（不是 AI 预测）；数据不足时不会给出建议。</p></div>
      <div class="card"><h2>淡旺季（每月参考价）</h2><canvas id="sea"></canvas><p class="note" id="seaNote"></p></div>
    </div>
  </div>
</section>
<section id="t-mx" class="tab">
  <div class="card" id="mxCard" style="display:none"><h2>价格矩阵（出发日 × 停留天数）</h2>
    <div class="ctrl">
      <label>月份<select id="mxMonth"></select></label>
      <label>查看日期<select id="mxSnap"></select></label>
      <label>对比<select id="mxCmp"></select></label>
      <label>天数从<input id="mxMin" type="number" style="width:76px"></label>
      <label>到<input id="mxMax" type="number" style="width:76px"></label>
    </div>
    <div style="overflow:auto;max-height:78vh"><table id="mx"></table></div><p class="note" id="mxNote"></p></div>
  <div class="card" id="mxEmpty"><p class="note">还没有矩阵数据。第一次抓取完成后会出现在这里。</p></div>
</section>
<section id="t-se" class="tab">
  <div class="grid-eq">
    <div class="card"><h2>各月价格对比（最新一次矩阵）</h2><canvas id="mom"></canvas><p class="note" id="momNote"></p></div>
    <div class="card"><h2>价格走势（各出发日的最低价）</h2><canvas id="trend"></canvas><p class="note" id="trNote"></p></div>
  </div>
</section>
<section id="t-tm" class="tab">
  <div class="grid-eq">
    <div class="card"><h2>哪天买票更划算（按星期几）</h2><canvas id="wk"></canvas><p class="note" id="wkNote"></p></div>
    <div class="card"><h2>提前多久买（距出发天数）</h2><canvas id="dtd"></canvas><p class="note" id="dtdNote"></p></div>
  </div>
</section>
</main></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const MONTHS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const WD=['周日','周一','周二','周三','周四','周五','周六'];
let charts={},state={doc:null,sort:'rec',rows:[]};
const fmtMin=m=>Math.floor(m/60)+'小时'+String(m%60).padStart(2,'0')+'分';
const addDays=(d,n)=>new Date(new Date(d+'T00:00:00Z').getTime()+n*864e5).toISOString().slice(0,10);
async function j(u){const r=await fetch(u,{cache:'no-cache'});if(!r.ok)throw 0;return r.json()}
function mk(tag,txt,cls){const e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}
function draw(id,cfg){
  Chart.defaults.color=css('--mut');Chart.defaults.borderColor=css('--grid');
  charts[id]&&charts[id].destroy();charts[id]=new Chart($(id),cfg)}
const killCharts=(...ids)=>ids.forEach(i=>{charts[i]&&charts[i].destroy();delete charts[i]});
const alpha=(c,a)=>`color-mix(in srgb, ${c} ${a}%, transparent)`;

/* ---------- tabs ---------- */
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.id==='t-'+b.dataset.tab));
  Object.values(charts).forEach(c=>c.resize())});
$('sort').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  state.sort=b.dataset.s;document.querySelectorAll('#sort button').forEach(x=>x.classList.toggle('on',x===b));renderFlights()});

/* ---------- flights + KPIs ---------- */
const stopColor=n=>n==0?'var(--good)':n==1?'var(--c4)':'var(--bad)';
function renderFlights(){
  const rows=[...state.rows],box=$('res');box.textContent='';
  if(!rows.length){box.appendChild(mk('p','所选日期范围内没有符合条件的航班。','note'));return}
  const cmp={rec:(a,b)=>a.stops-b.stops||a.duration-b.duration||a.price-b.price,
             price:(a,b)=>a.price-b.price||a.stops-b.stops,dur:(a,b)=>a.duration-b.duration||a.price-b.price}[state.sort];
  rows.sort(cmp);
  const minP=Math.min(...rows.map(r=>r.price)),minD=Math.min(...rows.map(r=>r.duration));let gotP=false,gotD=false;
  rows.slice(0,30).forEach((r,i)=>{
    const c=mk('div',null,'fl');c.style.setProperty('--s',stopColor(r.stops));
    c.appendChild(mk('div',null,'bar'));
    const mid=mk('div');
    const t=mk('div',r.dep.slice(5,16).replace(' ','  ')+'  →  '+r.arr.slice(5,16).replace(' ','  '),'t');
    if(r.price===minP&&!gotP&&(gotP=true))t.appendChild(Object.assign(mk('span','最低价','badge'),{style:'--b:var(--good)'}));
    if(r.duration===minD&&!gotD&&(gotD=true))t.appendChild(Object.assign(mk('span','最快','badge'),{style:'--b:var(--c7)'}));
    if(i===0&&state.sort==='rec')t.appendChild(Object.assign(mk('span','推荐','badge'),{style:'--b:var(--c1)'}));
    mid.appendChild(t);
    const m=mk('div',null,'m');
    const pill=mk('span',r.stops==0?'直飞':r.stops+' 次转机'+(r.via.length?'·'+r.via.join(','):''),'pill');pill.style.setProperty('--s',stopColor(r.stops));
    m.appendChild(pill);m.appendChild(mk('span',fmtMin(r.duration)));m.appendChild(mk('span',r.airlines.join(' / ')));
    m.appendChild(mk('span','出发日 '+r.k));
    mid.appendChild(m);c.appendChild(mid);
    const p=mk('div',String(r.price),'p');p.appendChild(mk('small',state.doc.currency));c.appendChild(p);
    box.appendChild(c)})
}
function kpi(label,value,sub,color){const k=mk('div',null,'kpi');k.style.setProperty('--k',color);
  k.appendChild(mk('div',label,'l'));k.appendChild(mk('div',value,'v'));k.appendChild(mk('div',sub,'s'));$('kpis').appendChild(k)}
function renderKpis(doc,rows,near){
  $('kpis').textContent='';
  const cur=doc.currency,best=rows.length?rows.reduce((a,b)=>a.price<=b.price?a:b):null;
  const fast=rows.length?rows.reduce((a,b)=>a.duration<=b.duration?a:b):null;
  kpi('当前最低价',best?best.price+' '+cur:'–',best?best.k+' 出发 · '+(best.stops?best.stops+' 次转机':'直飞'):'无符合条件的航班','var(--c3)');
  kpi('最短用时',fast?fmtMin(fast.duration):'–',fast?fast.airlines.join('/')+' · '+fast.price+' '+cur:'','var(--c7)');
  // week-over-week change of the cheapest price in range
  const days=[...new Set(near.flatMap(k=>Object.keys(doc.history[k]||{})))].sort();
  let chg='数据积累中',sub='需要至少 8 天记录',col='var(--c4)';
  if(days.length>=8){
    const at=d=>{const v=near.map(k=>(doc.history[k]||{})[d]).filter(x=>x!=null);return v.length?Math.min(...v):null};
    const a=at(days[days.length-1]),b=at(days[days.length-8]);
    if(a&&b){const p=(a/b-1)*100;chg=(p>=0?'▲ ':'▼ ')+Math.abs(p).toFixed(1)+'%';sub='最低价，对比 7 天前';col=p>0?'var(--c8)':'var(--c3)'}}
  kpi('近 7 天变化',chg,sub,col);
  kpi('已收集',days.length+' 天',doc.updated.slice(0,16).replace('T',' ')+' UTC 更新','var(--c1)');
}

/* ---------- main ---------- */
async function run(e){
  e&&e.preventDefault();
  const o=$('o').value.toUpperCase().trim(),d=$('d').value.toUpperCase().trim(),id=o+'-'+d;
  const stops=+$('st').value;let seas=null,doc=null;
  try{seas=await j('data/seasonality.json')}catch{}
  try{doc=await j('data/'+id+'.json')}catch{}
  state.doc=doc;
  // seasonality: estimate (traffic-light by level) + measured overlay
  if(seas){
    const f=seas.dest_factor[d]||seas.dest_factor.default;
    const est=seas.month_index_roundtrip_economy_1stop.map(x=>Math.round(x*seas.base_price*f));
    const sorted=[...est].sort((a,b)=>a-b),t1=sorted[3],t2=sorted[8];
    const lvl=v=>v<=t1?'var(--c3)':v<=t2?'var(--c4)':'var(--c8)';
    const meas=Array(12).fill(null);
    if(doc){const by={};
      for(const[dep,h]of Object.entries(doc.history)){const ds=Object.keys(h).sort();
        const m=+dep.slice(5,7)-1;(by[m]=by[m]||[]).push(h[ds[ds.length-1]])}
      for(const m in by)meas[m]=Math.round(by[m].reduce((a,b)=>a+b)/by[m].length)}
    draw('sea',{type:'bar',data:{labels:MONTHS,datasets:[
      {label:'估算',data:est,backgroundColor:est.map(v=>alpha(lvl(v),55)),borderRadius:4},
      {label:'实测',data:meas,backgroundColor:css('--c1'),borderRadius:4}]},
      options:{plugins:{legend:{position:'bottom'}},scales:{y:{title:{display:true,text:seas.currency}}}}});
    $('seaNote').textContent='绿=淡季，黄=平季，红=旺季（估算）；蓝色为实测。'+seas.note;
  }
  if(!doc){
    $('status').textContent='';$('status').appendChild(mk('span','路线 '+id+' 还没有被追踪。请在 config.json 的 routes 中添加后，下次定时任务会开始记录。','warn'));
    $('kpis').textContent='';$('res').textContent='';$('sumCard').style.display='none';$('mxCard').style.display='none';$('mxEmpty').style.display='';
    killCharts('trend','mom','wk','dtd');return}
  $('upd').textContent='数据更新于 '+doc.updated.replace('T',' ').replace('Z',' UTC');
  $('status').textContent=(doc.route.cabin!==$('cab').value||doc.route.adults!=$('ad').value||doc.route.children!=$('ch').value)?
    '注意：该路线追踪的是 '+doc.route.cabin+'、成人'+doc.route.adults+'、儿童'+doc.route.children+'，与你选的不同，价格仅供参考':'';
  const stay=doc.route.stay_days||42,W=doc.route.windows||[];
  if(!$('dep').dataset.touched&&W.length){$('dep').value=W[0].center;$('ret').value=addDays(W[0].center,stay)}
  const ch=$('chips');ch.textContent='';
  W.forEach(w=>{const b=mk('button',w.label,'chip');b.type='button';
    if($('dep').value===w.center)b.classList.add('on');
    b.onclick=()=>{$('dep').value=w.center;$('dep').dataset.touched=1;$('ret').value=addDays(w.center,stay);run()};ch.appendChild(b)});
  const dep=$('dep').value,flex=7;
  const near=Object.keys(doc.latest).sort().filter(k=>!dep||Math.abs((new Date(k)-new Date(dep))/864e5)<=flex);
  const rows=[];
  for(const k of near){const L=doc.latest[k];for(const of of L.offers)if(of.stops<=stops)rows.push({k,ret:L.return,...of})}
  state.rows=rows;renderKpis(doc,rows,near);renderFlights();
  // trend
  const days=[...new Set(near.flatMap(k=>Object.keys(doc.history[k]||{})))].sort();
  const pal=['--c1','--c2','--c3','--c7','--c5','--c4','--c8'].map(css);
  draw('trend',{type:'line',data:{labels:days,datasets:near.map((k,i)=>({label:'出发 '+k.slice(5),
    data:days.map(x=>(doc.history[k]||{})[x]??null),borderColor:pal[i%7],backgroundColor:pal[i%7],spanGaps:true,tension:.25,pointRadius:2,borderWidth:2}))},
    options:{plugins:{legend:{position:'bottom'}}}});
  $('trNote').textContent=days.length<2?'目前只有 '+days.length+' 天的数据，走势会随每日记录逐步形成。':'';
  analyze(doc);loadMatrix(id);loadSummary(id);
}

/* ---------- analysis ---------- */
function analyze(doc){
  const g=Array.from({length:7},()=>[]),dt=new Map();let n=0;
  for(const[dep,h]of Object.entries(doc.history)){
    const ds=Object.keys(h).sort(),m=ds.reduce((a,d)=>a+h[d],0)/(ds.length||1);
    for(const d of ds){
      const win=[-3,-2,-1,0,1,2,3].map(i=>h[addDays(d,i)]);
      if(win.every(x=>x!=null)){g[new Date(d+'T00:00:00Z').getUTCDay()].push(h[d]/(win.reduce((a,b)=>a+b)/7));n++}
      const k=Math.floor((new Date(dep)-new Date(d))/864e5/14)*14;
      if(k>=0)(dt.get(k)||dt.set(k,[]).get(k)).push(h[d]/m)}}
  const pct=a=>a.length?+((a.reduce((x,y)=>x+y)/a.length-1)*100).toFixed(2):null;
  const order=[1,2,3,4,5,6,0],vals=order.map(i=>pct(g[i]));
  draw('wk',{type:'bar',data:{labels:order.map(i=>WD[i]),datasets:[{data:vals,
    backgroundColor:vals.map(v=>v==null?css('--grid'):v<0?css('--c3'):css('--c8')),borderRadius:4}]},
    options:{plugins:{legend:{display:false}},scales:{y:{title:{display:true,text:'% 相对前后一周均价（负=更便宜）'}}}}});
  $('wkNote').textContent=n<28?'样本 '+n+' 条，不足约 4 周数据，结论暂不可靠；每天自动积累。':'基于 '+n+' 条记录（查询日按 UTC 计）。绿=比均价便宜，红=更贵。差异通常只有几个百分点。';
  const ks=[...dt.keys()].sort((a,b)=>b-a);
  draw('dtd',{type:'line',data:{labels:ks.map(k=>k+'–'+(k+13)+' 天前'),datasets:[{data:ks.map(k=>pct(dt.get(k))),
    borderColor:css('--c2'),backgroundColor:alpha(css('--c2'),22),fill:true,tension:.25,pointRadius:3,borderWidth:2}]},
    options:{plugins:{legend:{display:false}},scales:{y:{title:{display:true,text:'% 相对均价'}}}}});
  $('dtdNote').textContent=ks.length<3?'数据还不够，需要几周后才能看出价格随临近出发的变化。':'从左（离出发远）到右（临近出发）；上升段就是开始涨价的时期。';
}

/* ---------- matrix ---------- */
async function loadMatrix(id){
  const card=$('mxCard');let idx;
  try{idx=await j('data/matrix/'+id+'/index.json')}catch{card.style.display='none';$('mxEmpty').style.display='';killCharts('mom');$('momNote').textContent='还没有矩阵数据。';return}
  card.style.display='';$('mxEmpty').style.display='none';
  const snaps=[...idx.snapshots].sort().reverse();
  const fill=(sel,opts)=>{const keep=sel.value;sel.textContent='';opts.forEach(([v,t])=>{const o=mk('option',t);o.value=v;sel.appendChild(o)});if([...sel.options].some(o=>o.value===keep))sel.value=keep};
  fill($('mxSnap'),snaps.map(x=>[x,x]));
  fill($('mxCmp'),[['','不对比'],...snaps.map(x=>[x,x])]);
  const cur0=await j('data/matrix/'+id+'/'+snaps[0]+'.json');
  const months=[...new Set(Object.keys(cur0.p).map(k=>k.slice(0,7)))];
  fill($('mxMonth'),months.map(m=>[m,m.slice(5).replace(/^0/,'')+'月']));
  if(!$('mxMonth').dataset.set){$('mxMonth').dataset.set=1;$('mxMin').value=cur0.offsets[0];$('mxMax').value=cur0.offsets[cur0.offsets.length-1];
    if(snaps.length>1)$('mxCmp').value=snaps[Math.min(7,snaps.length-1)]}
  // month comparison (latest snapshot)
  const mm=months.map(m=>{const v=Object.entries(cur0.p).filter(([k])=>k.startsWith(m)).map(([,r])=>r.filter(x=>x!=null)).filter(r=>r.length).map(r=>Math.min(...r));
    return{m,avg:v.length?Math.round(v.reduce((a,b)=>a+b)/v.length):null,min:v.length?Math.min(...v):null}});
  draw('mom',{type:'bar',data:{labels:mm.map(x=>x.m.slice(5).replace(/^0/,'')+'月'),datasets:[
    {label:'平均最低价',data:mm.map(x=>x.avg),backgroundColor:css('--c1'),borderRadius:4},
    {label:'单日最低价',data:mm.map(x=>x.min),backgroundColor:css('--c3'),borderRadius:4}]},
    options:{plugins:{legend:{position:'bottom'}},scales:{y:{title:{display:true,text:cur0.currency}}}}});
  $('momNote').textContent='快照日期 '+snaps[0]+'：每个月各出发日最低价的平均值与最低值。';
  const draw_=async()=>{
    const cur=await j('data/matrix/'+id+'/'+$('mxSnap').value+'.json');
    let cmp=null;if($('mxCmp').value&&$('mxCmp').value!==$('mxSnap').value)try{cmp=await j('data/matrix/'+id+'/'+$('mxCmp').value+'.json')}catch{}
    const mo=$('mxMonth').value,dmin=+$('mxMin').value,dmax=+$('mxMax').value;
    const deps=Object.keys(cur.p).filter(k=>k.startsWith(mo));
    const ok=i=>cur.offsets[i]>=dmin&&cur.offsets[i]<=dmax;
    const vals=deps.flatMap(k=>cur.p[k].filter((v,i)=>v!=null&&ok(i)));
    const lo=Math.min(...vals),hi=Math.max(...vals);
    const t=$('mx');t.textContent='';
    const h=mk('tr');h.appendChild(mk('th','出发 \\ 停留'));
    cur.offsets.forEach(o=>h.appendChild(mk('th',o+' 天')));t.appendChild(h);
    for(const dep of deps){const row=cur.p[dep];
      const tr=mk('tr');tr.appendChild(mk('td',dep.slice(5)+' '+WD[new Date(dep+'T00:00:00Z').getUTCDay()]));
      row.forEach((v,i)=>{const td=mk('td');
        if(v==null){td.textContent='–'}else{
          td.appendChild(mk('div',String(v)));
          const sm=mk('div','返'+addDays(dep,cur.offsets[i]).slice(5)+' · '+cur.offsets[i]+'天','note');sm.style.cssText='font-size:11px;margin:0';td.appendChild(sm);
          const f=hi>lo?(v-lo)/(hi-lo):0;
          // cheap = green, mid = amber, expensive = red (traffic light by position in range)
          const col=f<.34?'var(--c3)':f<.67?'var(--c4)':'var(--c8)';
          td.style.background=alpha(col,18+Math.round(22*(f<.34?1-f/.34:f<.67?0:(f-.67)/.33)));
          if(v===lo&&ok(i)){td.style.fontWeight='700';td.style.outline='2px solid var(--c3)'}
          const pv=cmp&&cmp.p[dep]?cmp.p[dep][i]:null;
          if(pv!=null&&pv!==v){const dd=v-pv,sp=mk('div',(dd>0?'▲':'▼')+Math.abs(dd),'note');sp.style.cssText='font-size:11px;margin:0;font-weight:600;color:'+(dd>0?'var(--bad)':'var(--good)');td.appendChild(sp)}}
        td.title='返程 '+addDays(dep,cur.offsets[i]);
        if(!ok(i))td.style.opacity='.25';
        tr.appendChild(td)});t.appendChild(tr)}
    $('mxNote').textContent='单位 '+cur.currency+'。每格：价格、返程日期·总天数。绿=该月范围内便宜，黄=中等，红=偏贵；带绿框加粗的是最低价。天数不在筛选范围内的格子会变淡。'+(cmp?' ▲▼ 为相对 '+$('mxCmp').value+' 的涨跌。':'');
  };
  $('mxSnap').onchange=$('mxCmp').onchange=$('mxMonth').onchange=$('mxMin').oninput=$('mxMax').oninput=draw_;
  draw_();
}

/* ---------- summary ---------- */
async function loadSummary(id){
  const card=$('sumCard'),ul=$('sumList');ul.textContent='';
  try{const s=(await j('data/summary.json')).routes[id];if(!s)throw 0;
    s.bullets.forEach(b=>{const cls=/接近已观察到的最低价|低于观察期均价/.test(b)?'good':/观望|上涨中|涨/.test(b)&&/月：/.test(b)?'wait':'info';ul.appendChild(mk('li',b,cls))});
    card.style.display=''}catch{card.style.display='none'}
}

const t0=new Date(Date.now()+180*864e5);$('dep').value=t0.toISOString().slice(0,10);
$('ret').value=new Date(t0.getTime()+42*864e5).toISOString().slice(0,10);
$('dep').addEventListener('input',()=>{$('dep').dataset.touched=1});
$('f').addEventListener('submit',run);run();
</script></body></html>
