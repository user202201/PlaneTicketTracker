<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flight Tracker</title>
<style>
:root{
  color-scheme:light;
  --bg:#eef1f7;--card:#fff;--fg:#14213d;--mut:#5d6b82;--line:#e1e6f0;--soft:#f5f7fb;
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c7:#6250d6;--c8:#e34948;
  --good:#1a8f4c;--warn:#b87500;--bad:#d03b3a;--grid:#e6eaf2;--hero1:#2a78d6;--hero2:#6250d6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0e131c;--card:#171e2b;--fg:#e8edf6;--mut:#9aa7bd;--line:#273146;--soft:#1d2636;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c7:#9085e9;--c8:#e66767;
  --good:#3fb97a;--warn:#e0a43a;--bad:#e66767;--grid:#273146;--hero1:#1f4f95;--hero2:#40358f}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e131c;--card:#171e2b;--fg:#e8edf6;--mut:#9aa7bd;--line:#273146;--soft:#1d2636;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c7:#9085e9;--c8:#e66767;
  --good:#3fb97a;--warn:#e0a43a;--bad:#e66767;--grid:#273146;--hero1:#1f4f95;--hero2:#40358f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1480px;margin:0 auto;padding:0 20px}
h2{font-size:16px;margin:0 0 10px}
.top{background:linear-gradient(120deg,var(--hero1),var(--hero2));color:#fff;padding:16px 0 14px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;position:relative}
.brand{display:flex;align-items:baseline;gap:12px;font-size:21px;font-weight:700;flex-wrap:wrap}
.brand small{font-size:12px;font-weight:400;opacity:.85}
.gear{font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
#setPanel{display:none;position:absolute;right:0;top:44px;z-index:20;width:270px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#setPanel.open{display:block}
#setPanel label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);margin-bottom:10px}
#setPanel input{font:inherit;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.setsep{border-top:1px solid var(--line);margin:6px 0 10px;padding-top:10px;font-size:12px;font-weight:700;color:var(--fg)}
.hint{display:block;font-size:11px;line-height:1.4;color:var(--mut)}
#setPanel select{font:inherit;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;align-items:end}
form label{display:flex;flex-direction:column;font-size:12px;gap:3px;color:rgba(255,255,255,.85)}
form input,form select{font:inherit;padding:8px;border:0;border-radius:8px;background:rgba(255,255,255,.96);color:#14213d}
.go{font:inherit;font-weight:600;padding:9px 14px;border:0;border-radius:8px;background:#ffd166;color:#3a2a00;cursor:pointer}
#chips{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;padding:4px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
.chip.on{background:#fff;color:#2a4a9a;font-weight:600}
nav.tabs{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{font:inherit;font-weight:600;color:var(--mut);background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--c1);border-bottom-color:var(--c1)}
main{padding:16px 0 40px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,33,61,.04)}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.grid-eq{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px;align-items:start}
@media(max-width:980px){.grid2{grid-template-columns:1fr}.grid-eq{grid-template-columns:1fr}}
@media(max-width:480px){.grid-eq{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-top:4px solid var(--k,var(--c1))}
.kpi .l{font-size:12px;color:var(--mut)}.kpi .v{font-size:26px;font-weight:700;line-height:1.2;margin:2px 0}.kpi .s{font-size:12px;color:var(--mut)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.head h2{margin:0}
.note{color:var(--mut);font-size:13px;margin:8px 0 0}.warn{color:var(--warn)}
.flw{margin-bottom:10px}
.flw.open .fl{border-radius:12px 12px 0 0;border-bottom-color:transparent}
.det{display:none;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:14px 18px;background:var(--card)}
.flw.open .det{display:block}
.m2{font-size:13px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;color:var(--mut)}
.m2 b{color:var(--fg);font-size:15px;font-variant-numeric:tabular-nums}
.chev{display:block;font-size:12px;color:var(--mut);margin-top:2px;transition:transform .15s}
.flw.open .chev{transform:rotate(180deg)}
.leg{display:grid;grid-template-columns:78px 1fr;gap:6px 12px;margin-bottom:2px}
.leg .tm{font-weight:700;font-variant-numeric:tabular-nums}
.leg .ap{font-size:14px}.leg .sub{font-size:12px;color:var(--mut)}
.lay{margin:6px 0 6px 90px;padding:3px 10px;border-left:3px solid var(--c4);font-size:12px;color:var(--warn);background:color-mix(in srgb,var(--c4) 10%,transparent);border-radius:0 6px 6px 0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns a{text-decoration:none;font-size:13px;font-weight:600;padding:7px 14px;border-radius:8px;color:#fff;background:var(--c1)}
.btns a.k{background:var(--c2)}.btns a.s{background:var(--c7)}
.modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(8,12,20,.62);padding:24px 12px;overflow:auto}
.modal.open{display:block}
.mpanel{position:relative;max-width:900px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px 18px 8px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.mclose{position:absolute;right:12px;top:8px;font-size:28px;line-height:1;border:0;background:none;color:var(--mut);cursor:pointer}
#mtitle{padding-right:34px;margin-bottom:12px}
td.cell{cursor:pointer}td.cell:hover{outline:2px solid var(--c1);outline-offset:-2px}
.gt{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:9px 12px;margin:8px 0;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
.gt b{font-variant-numeric:tabular-nums}.gt .r{display:flex;gap:10px;align-items:center}
.gt a{text-decoration:none;font-size:13px;font-weight:600;padding:5px 12px;border-radius:8px;color:#fff;background:var(--c1)}
.gt label{font-size:13px;color:var(--mut);display:flex;gap:5px;align-items:center;cursor:pointer}
.top{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--soft);cursor:pointer}
.top:hover{outline:2px solid var(--c1);outline-offset:-2px}.top .n{font-weight:700;color:var(--mut);text-align:center}
.top .p{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;text-align:right}.top small{display:block;color:var(--mut);font-size:12px}
.tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:999px;margin-left:6px;background:color-mix(in srgb,var(--c7) 20%,transparent);color:var(--c7)}
.tag.ex{background:color-mix(in srgb,var(--c3) 22%,transparent);color:var(--good)}
.dsum{font-size:13px;color:var(--mut);margin-bottom:10px}
.tl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;margin:10px 0 4px}
.tl .end{text-align:center;min-width:54px}.tl .end b{display:block;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.tl .end span{font-size:12px;color:var(--mut)}.tl .end i{font-style:normal;font-size:11px;color:var(--warn);font-weight:600;margin-left:3px;vertical-align:top}
.tl .mid{min-width:0}.tl .cap{text-align:center;font-size:13px;font-weight:600;margin-bottom:2px}
.trk{display:flex;align-items:center;height:46px;position:relative}
.trk .sg{position:relative;height:100%;display:flex;align-items:center;min-width:46px}
.trk .sg::before{content:"";display:block;width:100%;height:7px;border-radius:4px;background:var(--a)}
.trk .sg em{position:absolute;top:2px;left:0;right:0;text-align:center;font-style:normal;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .ly{position:relative;height:100%;display:flex;align-items:center;min-width:64px}
.trk .ly::before{content:"";display:block;width:100%;border-top:2px dotted var(--mut)}
.trk .ly .nd{position:absolute;left:50%;top:50%;width:13px;height:13px;margin:-7px 0 0 -7px;border-radius:50%;border:3px solid var(--warn);background:var(--card)}
.trk .ly .nl{position:absolute;left:50%;top:calc(50% + 10px);transform:translateX(-50%);text-align:center;font-size:11px;line-height:1.25;white-space:nowrap}
.trk .ly .nl b{display:block;font-size:12px}.trk .ly .nl span{color:var(--warn);font-weight:600}
.tl.c{margin:8px 0 16px;gap:10px}.tl.c .end b{font-size:15px}.tl.c .end{min-width:40px}.tl.c .trk{height:34px}.tl.c .trk .sg::before{height:5px}
.tl.c .trk .sg em{display:none}.tl.c .trk .sg{min-width:30px}.tl.c .trk .ly{min-width:50px}.tl.c .trk .ly .nl{font-size:10px}.tl.c .trk .ly .nl b{font-size:11px}
.tl.c .cap{display:none}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:6px 0 10px}
.lgd span::before{content:"";display:inline-block;width:14px;height:6px;border-radius:3px;background:var(--a);margin-right:6px;vertical-align:middle}
.fl{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px 12px 0;cursor:pointer;border:1px solid var(--line);border-radius:12px;background:var(--soft);overflow:hidden}
.fl .bar{align-self:stretch;background:var(--s)}
.fl .t{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.fl .m{font-size:13px;color:var(--mut);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;background:var(--s)}
.badge{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:600;margin-left:6px;background:color-mix(in srgb,var(--b) 18%,transparent);color:var(--b)}
.fl .p{text-align:right;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.fl .p small{display:block;font-size:12px;font-weight:400;color:var(--mut)}
#sumList{margin:0;padding:0;list-style:none}
#sumList li{padding:8px 10px 8px 12px;margin-bottom:8px;border-left:4px solid var(--c7);background:var(--soft);border-radius:0 8px 8px 0;font-size:14px}
#sumList li.good{border-left-color:var(--good)}#sumList li.wait{border-left-color:var(--warn)}
table{width:100%;border-collapse:separate;border-spacing:2px}
th{color:var(--mut);font-weight:500;font-size:12px;padding:4px 6px;text-align:right;position:sticky;top:0;background:var(--card)}
th:first-child,td:first-child{text-align:left;white-space:nowrap}
td{padding:5px 6px;font-size:14px;border-radius:6px;text-align:right;font-variant-numeric:tabular-nums}
td:first-child{font-weight:600}
.ctrl{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;align-items:end}
.ctrl label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.ctrl select,.ctrl input{font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
canvas{max-height:340px}
</style></head><body>
<header class="top"><div class="wrap">
  <div class="brandrow">
    <div class="brand">✈ <span data-i18n="title"></span> <small id="upd"></small></div>
    <div><button class="gear" id="gear" type="button">⚙ <span data-i18n="settings"></span></button>
      <div id="setPanel">
        <label><span data-i18n="theme"></span><select id="selTheme">
          <option value="auto" data-i18n="th_auto"></option><option value="light" data-i18n="th_light"></option><option value="dark" data-i18n="th_dark"></option></select></label>
        <label><span data-i18n="lang_l"></span><select id="selLang">
          <option value="zh">中文</option><option value="en">English</option><option value="fr">Français</option></select></label>
        <div class="setsep"><span data-i18n="rank_h"></span></div>
        <label><span><span data-i18n="w_time"></span> <span class="curtag">CAD</span></span><input id="inTv" type="number" min="0" step="10"></label>
        <label><span><span data-i18n="w_stop"></span> <span class="curtag">CAD</span></span><input id="inSp" type="number" min="0" step="10"></label>
        <small class="hint" data-i18n="rank_hint"></small>
      </div></div>
  </div>
  <form id="f">
    <label><span data-i18n="origin"></span><input id="o" value="YUL" maxlength="3"></label>
    <label><span data-i18n="dest"></span><input id="d" value="PEK" maxlength="3"></label>
    <label><span data-i18n="depart"></span><input id="dep" type="date"></label>
    <label><span data-i18n="ret"></span><input id="ret" type="date"></label>
    <label><span data-i18n="stops"></span><select id="st"><option value="0" data-i18n="s0"></option><option value="1" data-i18n="s1" selected></option><option value="2" data-i18n="s2"></option></select></label>
    <label><span data-i18n="cabin"></span><select id="cab"><option value="economy" data-i18n="c_economy" selected></option><option value="premium-economy" data-i18n="c_premium-economy"></option><option value="business" data-i18n="c_business"></option><option value="first" data-i18n="c_first"></option></select></label>
    <label><span data-i18n="adults"></span><input id="ad" type="number" min="1" max="9" value="1"></label>
    <label><span data-i18n="children"></span><input id="ch" type="number" min="0" max="8" value="0"></label>
    <button class="go" data-i18n="go"></button>
  </form>
  <div id="chips"></div>
</div></header>
<div class="wrap">
<nav class="tabs" id="tabs">
  <button data-tab="ov" class="on" data-i18n="tab_ov"></button><button data-tab="mx" data-i18n="tab_mx"></button>
  <button data-tab="se" data-i18n="tab_se"></button><button data-tab="tm" data-i18n="tab_tm"></button>
</nav>
<main>
<p class="note" id="status"></p>
<section id="t-ov" class="tab on">
  <div class="kpis" id="kpis"></div>
  <div class="grid2">
    <div class="card"><div class="head"><h2 data-i18n="flights_h"></h2><div class="ctrl" id="sortCtl" style="margin:0"></div></div>
      <div id="res"></div></div>
    <div>
      <div class="card" id="sumCard" style="display:none"><h2 data-i18n="sum_h"></h2><ul id="sumList"></ul><p class="note" data-i18n="sum_note"></p></div>
      <div class="card" id="topCard" style="display:none"><h2 data-i18n="top_h"></h2><div id="topList"></div><p class="note" data-i18n="top_note"></p></div>
      <div class="card" id="gdCard" style="display:none"><h2 data-i18n="gd_h"></h2><p class="note" style="margin-top:0" data-i18n="gd_intro"></p>
        <div class="btns" id="gdBtns" style="margin-top:6px"></div><p class="note" id="gdQ"></p></div>
      <div class="card" id="gtCard" style="display:none"><h2 data-i18n="gt_h"></h2><p class="note" style="margin-top:0" data-i18n="gt_intro"></p><div id="gtList"></div><p class="note" data-i18n="gt_how"></p></div>
      <div class="card"><h2 data-i18n="sea_h"></h2><canvas id="sea"></canvas><p class="note" id="seaNote"></p></div>
    </div>
  </div>
</section>
<section id="t-mx" class="tab">
  <div class="card" id="mxCard" style="display:none"><h2 data-i18n="mx_h"></h2>
    <div class="ctrl">
      <label><span data-i18n="mx_month"></span><select id="mxMonth"></select></label>
      <label><span data-i18n="mx_snap"></span><select id="mxSnap"></select></label>
      <label><span data-i18n="mx_cmp"></span><select id="mxCmp"></select></label>
      <label><span data-i18n="mx_from"></span><input id="mxMin" type="number" style="width:76px"></label>
      <label><span data-i18n="mx_to"></span><input id="mxMax" type="number" style="width:76px"></label>
    </div>
    <div style="overflow:auto;max-height:78vh"><table id="mx"></table></div><p class="note" id="mxNote"></p></div>
  <div class="card" id="mxEmpty"><p class="note" data-i18n="mx_empty"></p></div>
</section>
<section id="t-se" class="tab">
  <div class="grid-eq">
    <div class="card"><h2 data-i18n="mom_h"></h2><canvas id="mom"></canvas><p class="note" id="momNote"></p></div>
    <div class="card"><h2 data-i18n="tr_h"></h2><canvas id="trend"></canvas><p class="note" id="trNote"></p></div>
  </div>
</section>
<section id="t-tm" class="tab">
  <div class="grid-eq">
    <div class="card"><h2 data-i18n="wk_h"></h2><canvas id="wk"></canvas><p class="note" id="wkNote"></p></div>
    <div class="card"><h2 data-i18n="dtd_h"></h2><canvas id="dtd"></canvas><p class="note" id="dtdNote"></p></div>
    <div class="card"><h2 data-i18n="tod_h"></h2><canvas id="tod"></canvas><p class="note" id="todNote"></p></div>
  </div>
</section>
</main></div>
<div id="modal" class="modal" aria-hidden="true"><div class="mpanel">
  <button class="mclose" id="mclose" type="button" aria-label="close">×</button>
  <h2 id="mtitle"></h2><div id="mbody"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
/* ================= i18n ================= */
const I18N={
zh:{title:'机票追踪',settings:'设置',theme:'主题',th_auto:'跟随系统',th_light:'浅色',th_dark:'深色',lang_l:'语言',
 updated:'数据更新于 {0} UTC',origin:'出发地',dest:'目的地',depart:'出发日期',ret:'返程日期',stops:'停靠次数',s0:'仅直飞',s1:'≤1 次',s2:'≤2 次',
 cabin:'舱位',c_economy:'经济舱','c_premium-economy':'超级经济舱',c_business:'商务舱',c_first:'头等舱',adults:'成人',children:'儿童',go:'查看',
 tab_ov:'总览',tab_mx:'价格矩阵',tab_se:'走势与淡旺季',tab_tm:'买票时机',

const AIRC=['--c1','--c2','--c3','--c7','--c5','--c4'];
const shortMin=m=>m==null?'':Math.floor(m/60)+'h'+String(m%60).padStart(2,'0');
function timeline(r,compact){
  const R=state.doc.route,legs=r.legs&&r.legs.length?r.legs:null;
  const colors={};let ci=0;
  const col=al=>{if(!(al in colors))colors[al]=AIRC[ci++%AIRC.length];return 'var('+colors[al]+')'};
  const hm=x=>x.slice(11,16),day=x=>x.slice(0,10);
  const tl=mk('div',null,'tl'+(compact?' c':''));
  let depT,depA,arrT,arrA,plus=0,segs=[];
  if(legs){
    depT=hm(legs[0].dep);depA=legs[0].a;const L=legs[legs.length-1];arrT=hm(L.arr);arrA=L.b;
    plus=Math.round((new Date(day(L.arr))-new Date(day(legs[0].dep)))/864e5);
    legs.forEach((l,i)=>{segs.push({k:'sg',w:l.min||60,al:l.al,no:[l.al,l.no].filter(Boolean).join(' ')});
      if(i<legs.length-1)segs.push({k:'ly',w:(r.lay&&r.lay[i]!=null)?r.lay[i]:90,code:l.b,min:(r.lay&&r.lay[i]!=null)?r.lay[i]:null})});
  }else{      // older data without segment details: draw nodes at the connection airports
    depT=hm(r.dep);arrT=hm(r.arr);depA=R.origin;arrA=R.dest;
    plus=Math.round((new Date(day(r.arr))-new Date(day(r.dep)))/864e5);
    const via=r.via||[];for(let i=0;i<=via.length;i++){segs.push({k:'sg',w:1000,al:r.airlines[Math.min(i,r.airlines.length-1)]||'?',no:''});
      if(i<via.length)segs.push({k:'ly',w:200,code:via[i],min:null})}
  }
  const end=(tm,ap,pl)=>{const e=mk('div',null,'end');const b=mk('b',tm);if(pl>0)b.appendChild(mk('i','+'+pl));e.appendChild(b);e.appendChild(mk('span',ap));return e};
  tl.appendChild(end(depT,depA,0));
  const mid=mk('div',null,'mid');
  mid.appendChild(mk('div',(r.stops==0?t('nonstop'):t('nstops',r.stops))+' · '+fmtMin(r.duration),'cap'));
  const trk=mk('div',null,'trk');
  segs.forEach(s=>{const d=mk('div',null,s.k);d.style.flex=s.w+' 1 0';
    if(s.k==='sg'){d.style.setProperty('--a',col(s.al));if(s.no)d.appendChild(mk('em',s.no));d.title=s.no||s.al}
    else{d.appendChild(mk('div',null,'nd'));const nl=mk('div',null,'nl');nl.appendChild(mk('b',s.code));if(s.min!=null)nl.appendChild(mk('span',shortMin(s.min)));d.appendChild(nl)}
    trk.appendChild(d)});
  mid.appendChild(trk);tl.appendChild(mid);tl.appendChild(end(arrT,arrA,plus));
  return {el:tl,colors};
}

const PB={v(n){const o=[];while(n>127){o.push((n&127)|128);n>>>=7}o.push(n);return o},
  tag(f,w){return PB.v((f<<3)|w)},vi(f,n){return[...PB.tag(f,0),...PB.v(n)]},
  ld(f,b){return[...PB.tag(f,2),...PB.v(b.length),...b]},s(f,x){return PB.ld(f,[...new TextEncoder().encode(x)])}};
function pbLeg(date,from,to,it){
  let b=[...PB.s(2,date)];
  if(it){
    b.push(...PB.vi(5,Math.min(3,(it.stops||0)+1)));                          // Google: 1 = nonstop, 2 = <=1 stop, 3 = <=2 stops
    const codes=[...new Set((it.legs||[]).map(l=>l.c||NAME2CODE[l.al]).filter(Boolean))];
    codes.forEach(c=>b.push(...PB.s(6,c)));
    if(it.legs&&it.legs.length){const h=+it.legs[0].dep.slice(11,13);b.push(...PB.vi(8,h),...PB.vi(9,Math.min(23,h+1)))}
  }
  b.push(...PB.ld(13,PB.s(2,from)),...PB.ld(14,PB.s(2,to)));
  if(it&&it.via)it.via.forEach(v=>b.push(...PB.s(15,v)));
  return b}
function googlePinned(o,dep,ret){
  const r=state.doc.route,from=r.origin,to=r.dest,ad=+$('ad').value||r.adults||1,chd=+$('ch').value||0,cab=$('cab').value;

  let info=[...PB.ld(3,pbLeg(dep,from,to,o.legs?o:null))];
  if(ret)info.push(...PB.ld(3,pbLeg(ret,to,from,bi)));
  const pax=[];for(let i=0;i<ad;i++)pax.push(1);for(let i=0;i<chd;i++)pax.push(2);
  info.push(...PB.ld(8,pax),...PB.vi(9,{economy:1,'premium-economy':2,business:3,first:4}[cab]||1),...PB.vi(19,ret?1:2));
  const b64=btoa(String.fromCharCode(...info));
  return 'https://www.google.com/travel/flights/search?tfs='+encodeURIComponent(b64)+'&hl='+({zh:'zh-CN',en:'en',fr:'fr'}[LANG])+'&curr='+state.doc.currency}

function kpi(label,value,sub,color){const k=mk('div',null,'kpi');k.style.setProperty('--k',color);

function renderKpis(doc,rows,near){

/* ================= analysis ================= */
function analyze(doc){
  const g=Array.from({length:7},()=>[]),dt=new Map();let n=0;
  for(const[dep,h]of Object.entries(doc.history)){
    const ds=Object.keys(h).sort(),m=ds.reduce((a,d)=>a+h[d],0)/(ds.length||1);
    for(const d of ds){
      const win=[-3,-2,-1,0,1,2,3].map(i=>h[addDays(d,i)]);
      if(win.every(x=>x!=null)){g[dow(d)].push(h[d]/(win.reduce((a,b)=>a+b)/7));n++}
      const k=Math.floor((new Date(dep)-new Date(d))/864e5/14)*14;
      if(k>=0)(dt.get(k)||dt.set(k,[]).get(k)).push(h[d]/m)}}
  const pct=a=>a.length?+((a.reduce((x,y)=>x+y)/a.length-1)*100).toFixed(2):null;
  const order=[1,2,3,4,5,6,0],vals=order.map(i=>pct(g[i]));
  draw('wk',{type:'bar',data:{labels:order.map(WDAY),datasets:[{data:vals,
    backgroundColor:vals.map(v=>v==null?css('--grid'):v<0?css('--c3'):css('--c8')),borderRadius:4}]},
    options:{plugins:{legend:{display:false}},scales:{y:{title:{display:true,text:t('wk_axis')}}}}});
  $('wkNote').textContent=n<28?t('wk_few',n):t('wk_ok',n);
  const ks=[...dt.keys()].sort((a,b)=>b-a);
  draw('dtd',{type:'line',data:{labels:ks.map(k=>t('dtd_bucket',k,k+13)),datasets:[{data:ks.map(k=>pct(dt.get(k))),
    borderColor:css('--c2'),backgroundColor:cv(css('--c2'),.22),fill:true,tension:.25,pointRadius:3,borderWidth:2}]},
    options:{plugins:{legend:{display:false}},scales:{y:{title:{display:true,text:t('dtd_axis')}}}}});
  $('dtdNote').textContent=ks.length<3?t('dtd_few'):t('dtd_ok');
}

/* ================= time of day (same cells probed at morning / noon / afternoon) ================= */
async function loadTod(id){
  let d=null;try{d=await j('data/tod/'+id+'.json')}catch{}
  const slots=['am','noon','pm'],r={am:[],noon:[],pm:[]},days=new Set();let n=0;

    const m=vals.reduce((a,b)=>a+b)/3;slots.forEach((s,i)=>r[s].push(vals[i]/m));days.add(day);n+=3}
  const pct=a=>a.length?+((a.reduce((x,y)=>x+y)/a.length-1)*100).toFixed(2):null;
  const vals=slots.map(s=>pct(r[s]));
  draw('tod',{type:'bar',data:{labels:slots.map(s=>t('slot_'+s)),datasets:[{data:vals,
    backgroundColor:vals.map(v=>v==null?css('--grid'):v<0?css('--c3'):css('--c8')),borderRadius:4}]},
    options:{plugins:{legend:{display:false}},scales:{y:{title:{display:true,text:t('tod_axis')}}}}});

/* ================= Google flexible-dates search (natural language) built from the config ================= */
function discoverText(destName,stay,specs){
  const mn=m=>MONTH(+m.slice(5)-1);const plain=[],pieces=[],byRet={};
  specs.forEach(sp=>{const o=typeof sp==='string'?{month:sp}:sp;
    if(o.from_day>1){pieces.push({zh:`${+o.month.slice(5)}月${o.from_day}日之后出发`,en:`in ${mn(o.month)} only after the ${o.from_day}th`,fr:`en ${mn(o.month)} seulement après le ${o.from_day}`})}
    else if(!o.return_by)plain.push(o.month);
    if(o.return_by)(byRet[o.return_by]=byRet[o.return_by]||[]).push(o.month)});
  const L=ms=>ms.map(mn).join(LANG==='zh'?'、':', ');
  const dm=d=>({zh:`${+d.slice(5,7)}月${+d.slice(8)}日`,en:mn(d.slice(0,7))+' '+(+d.slice(8)),fr:(+d.slice(8))+' '+mn(d.slice(0,7))})[LANG];
  const parts=[];
  if(plain.length)parts.push({zh:`${L(plain)}出发都行`,en:`depart in ${L(plain)}`,fr:`départ en ${L(plain)}`}[LANG]);
  pieces.forEach(p=>parts.push(p[LANG]));
  Object.entries(byRet).forEach(([r,ms])=>parts.push({zh:`${L(ms)}出发的话返程要在${dm(r)}之前`,en:`for ${L(ms)} departures, return before ${dm(r)}`,fr:`pour un départ en ${L(ms)}, retour avant le ${dm(r)}`}[LANG]));
  const o=t('gd_city').YUL;
  return {zh:`${o}到${destName} 往返 经济舱 ${stay}天左右的旅行 ${parts.join('；')} 最多转机1次`,
          en:`Round trip from ${o} to ${destName}, economy, about ${stay} days, ${parts.join('; ')}, at most 1 stop`,
          fr:`Aller-retour de ${o} à ${destName}, économie, environ ${stay} jours, ${parts.join(' ; ')}, 1 escale maximum`}[LANG]}
function renderDiscover(doc){
  const card=$('gdCard'),box=$('gdBtns');box.textContent='';
  const specs=doc.route.months||[];if(!specs.length){card.style.display='none';return}
  card.style.display='';
  const stay=Math.min(doc.route.stay_days||42,30),city=t('gd_city');
  const mkBtn=(label,dest,cls)=>{const q=discoverText(dest,stay,specs);
    const a=mk('a',label,cls||'');a.href='https://www.google.com/travel/flights?q='+encodeURIComponent(q)+'&hl='+({zh:'zh-CN',en:'en',fr:'fr'}[LANG])+'&curr='+doc.currency;
    a.target='_blank';a.rel='noopener noreferrer';box.appendChild(a);return q};
  let last;
  ['PEK','PVG','CGO'].forEach(c=>{last=mkBtn(city[c]||c,city[c]||c)});
  last=mkBtn(t('gd_all'),t('gd_china'),'k');
  $('gdQ').textContent=t('gd_q',discoverText(city[doc.route.dest]||doc.route.dest,stay,specs))+' · '+t('gd_note');
}

/* ================= Google price tracking: cheapest date pair per month, one click to Google ================= */
async function renderTrack(id){
  const card=$('gtCard'),box=$('gtList');box.textContent='';
  const data=await cellOffers(id);
  if(!data){card.style.display='none';return}
  const best={};
  for(const[dep,byOff]of Object.entries(data)){if(dep==='_date')continue;
    for(const[off,c]of Object.entries(byOff)){const p=Math.min(...c.offers.map(o=>o.price));const m=dep.slice(0,7);
      if(!best[m]||p<best[m].p)best[m]={dep,ret:c.ret,p,off}}}
  const rows=Object.entries(best).sort((a,b)=>a[0]<b[0]?-1:1);
  if(!rows.length){card.style.display='none';return}
  card.style.display='';
  rows.forEach(([m,b])=>{
    const r=mk('div',null,'gt');
    const left=mk('div');left.appendChild(mk('b',t('gt_row',MONTH(+m.slice(5)-1),b.dep.slice(5),b.ret.slice(5),b.off)));
    left.appendChild(mk('span','  '+b.p+' '+state.doc.currency,'note'));r.appendChild(left);
    const right=mk('div',null,'r');
    const a=mk('a',t('gt_open'));a.href=bookLinks({},b.dep,b.ret)[0][1];a.target='_blank';a.rel='noopener noreferrer';right.appendChild(a);
    r.appendChild(right);box.appendChild(r)})
}

/* ================= matrix cell -> same flight list in a pop-up ================= */
const CELLS={};
async function cellOffers(id){if(!(id in CELLS)){try{CELLS[id]=await j('data/matrix/'+id+'/offers.json')}catch{CELLS[id]=null}}return CELLS[id]}
function closeModal(){$('modal').classList.remove('open');$('modal').setAttribute('aria-hidden','true')}
$('mclose').onclick=closeModal;
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
async function openCell(dep,off,isLatest,isCal){
  const doc=state.doc,id=doc.route.id,ret=addDays(dep,off),body=$('mbody');
  $('mtitle').textContent=t('cell_title',dep,ret,off);body.textContent='';
  $('modal').classList.add('open');$('modal').setAttribute('aria-hidden','false');
  const data=await cellOffers(id),cell=data&&data[dep]&&data[dep][String(off)];
  if(!isLatest)body.appendChild(mk('p',t('cell_old'),'note'));
  const stops=+$('st').value;
  const rows=cell?cell.offers.filter(o=>o.stops<=stops).map(o=>({k:dep,retDate:cell.ret,...o})):[];
  if(rows.length){const box=mk('div');body.appendChild(box);renderRows(box,rows);return}
  body.appendChild(mk('p',isCal?t('cell_cal',off):t('cell_none'),'note'));
  const bt=mk('div',null,'btns');
  bookLinks({},dep,ret).forEach(([n,u,c])=>{const a=mk('a',n,c);a.href=u;a.target='_blank';a.rel='noopener noreferrer';bt.appendChild(a)});
  body.appendChild(bt);
}

/* ================= summary (generated in 3 languages by the backend) ================= */
async function loadSummary(id){
  const card=$('sumCard'),ul=$('sumList');ul.textContent='';
  try{const s=(await j('data/summary.json')).routes[id];if(!s)throw 0;
    const list=Array.isArray(s.bullets)?s.bullets.map(x=>({t:x,c:'info'})):(s.bullets[LANG]||s.bullets.zh||[]);
    list.forEach(b=>ul.appendChild(mk('li',b.t,b.c)));card.style.display=''}catch{card.style.display='none'}
}
