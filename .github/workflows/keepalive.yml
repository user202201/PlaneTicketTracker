name: keepalive
on:
  schedule:
    - cron: "23 5 1,15 * *"     # twice a month
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - name: Touch a file so the repo never looks inactive (60-day rule for scheduled workflows)
        run: |
          date -u +%F > .github/keepalive.txt
          git config user.name "price-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .github/keepalive.txt
          git diff --cached --quiet || (git commit -m "keepalive $(date -u +%F)" && git push origin HEAD:"${{ github.ref_name }}")
