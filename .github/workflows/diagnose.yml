name: diagnose
on:
  push:
    paths: [".github/run-diagnose.txt"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: diagnose
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: tracker/requirements.txt }
      - run: pip install -r tracker/requirements.txt
      - run: python tracker/diagnose.py
      - name: Save result
        if: always()
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/diagnose.json || true
          git diff --cached --quiet || (git commit -m "diagnose: $(date -u +%F\ %H:%M)" && git pull --rebase -X theirs && git push)
