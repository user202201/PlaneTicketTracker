name: track-prices
on:
  schedule:
    - cron: "17 11 * * *"   # once daily at a fixed time (keeps weekday comparison fair)
  workflow_dispatch:
    inputs:
      mode:
        description: "full = normal run; diagnose = 1-minute test that records what Google returns"
        type: choice
        options: [full, diagnose]
        default: full
permissions:
  contents: write
concurrency: track
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: tracker/requirements.txt }
      - run: pip install -r tracker/requirements.txt
      - name: Diagnose (1 min)
        if: inputs.mode == 'diagnose'
        run: python tracker/diagnose.py
      - name: Fetch prices
        if: inputs.mode != 'diagnose'
        run: python tracker/fetch.py
      - name: Summarize
        if: inputs.mode != 'diagnose'
        run: python tracker/summarize.py
      - name: Email alerts
        if: inputs.mode != 'diagnose'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python tracker/alert.py
      - name: Commit data
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "data: $(date -u +%F\ %H:%M)" && git pull --rebase && git push)
