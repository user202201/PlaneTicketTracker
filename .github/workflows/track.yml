name: track-prices
on:
  push:
    paths: [".github/run-trigger.txt"]   # touch this file to start a normal run
  schedule:
    - cron: "7 * * * *"   # hourly: each run does a small random-size batch and resumes the day's missing cells
  workflow_dispatch:
    inputs:
      mode:
        description: "full = normal run; diagnose = 1-minute test that records what Google returns"
        type: choice
        options: [full, diagnose]
        default: full
permissions:
  contents: write
concurrency: track
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }   # always the branch tip (earlier runs may have committed data meanwhile)
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: tracker/requirements.txt }
      - run: pip install -r tracker/requirements.txt
      - name: Git identity (for in-run checkpoints)
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
      - name: Random start delay (scheduled runs only)
        if: github.event_name == 'schedule'
        run: sleep $(( (RANDOM % 600) + 30 ))
      - name: Diagnose (1 min)
        if: inputs.mode == 'diagnose'
        continue-on-error: true
        run: python tracker/diagnose.py
      - name: Save diagnose result right away
        if: inputs.mode == 'diagnose'
        continue-on-error: true
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/diagnose.json || true
          git diff --cached --quiet || (git commit -m "diagnose: $(date -u +%F\ %H:%M)" && git pull --rebase -X theirs && git push)
      - name: Fetch prices
        if: inputs.mode != 'diagnose'
        run: python tracker/fetch.py
      - name: Summarize
        if: inputs.mode != 'diagnose'
        run: python tracker/summarize.py
      - name: Email alerts
        if: inputs.mode != 'diagnose'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python tracker/alert.py
      - name: Commit data
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "data: $(date -u +%F\ %H:%M)" && git pull --rebase -X theirs && git push)
